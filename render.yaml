services:
  - type: web
    name: brandguard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BRANDGUARD_ANTHROPIC_API_KEY
        sync: false
      - key: BRANDGUARD_MODEL
        value: claude-haiku-5-5
      - key: BRANDGUARD_AI_BUDGET_USD
        value: "1.00"
      - key: BRANDGUARD_AI_MAX_PER_HOUR
        value: "30"
