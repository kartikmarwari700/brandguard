# Render's free plan sleeps after 15 idle minutes; a ping every 10 minutes keeps the demo instant for judges.
# Set the repository variable APP_URL (Settings -> Secrets and variables -> Actions -> Variables).
name: Keep demo awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.APP_URL != '' }}
    steps:
      - run: curl -fsS --max-time 60 "${{ vars.APP_URL }}/api/status" || true
